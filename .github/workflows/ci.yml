name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      # The site lives in help/, but the root index.html and 404.html are published too.
      - "help/**"
      - "index.html"
      - "404.html"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ci.yml"
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  lint:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check Prettier formatting
        run: npm run lint

      # A custom `if:` replaces the implicit success(), and forgetting it lets a failed
      # upload commit a half-patched card. Keep every gated step carrying it.
      - name: Gated release steps must require success()
        run: |
          total=$(grep -c 'steps.check.outputs.changed' .github/workflows/sdvx-release.yml)
          gated=$(grep -c 'success() && steps.check.outputs.changed' .github/workflows/sdvx-release.yml)
          [ "$total" = "$gated" ] || { echo "::error::a gated step is missing success()"; exit 1; }

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: lint
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Stage the site
        run: |
          mkdir _site
          cp -r index.html help CNAME robots.txt sitemap.xml 404.html _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
