<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Oniichan.wtf - SDVX & Yuancon FAQ Guide" />
    <title>Oniichan.wtf - SDVX Guide</title>
    <!-- A timed redirect with no content of its own, so it carries noindex and is left
         out of sitemap.xml. -->
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#1e1f2b" />
    <meta name="color-scheme" content="dark" />
    <link rel="canonical" href="https://oniichan.wtf/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Oniichan.wtf - SDVX &amp; Yuancon FAQ Guide" />
    <meta property="og:description" content="SDVX &amp; Yuancon FAQ guide, skins and song packs." />
    <meta property="og:image" content="https://oniichan.wtf/help/assets/images/icon-512.png" />
    <meta property="og:url" content="https://oniichan.wtf/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Oniichan.wtf - SDVX &amp; Yuancon FAQ Guide" />
    <meta
      name="twitter:description"
      content="SDVX &amp; Yuancon FAQ guide, skins and song packs."
    />
    <meta name="twitter:image" content="https://oniichan.wtf/help/assets/images/icon-512.png" />
    <link rel="icon" type="image/x-icon" href="./help/assets/images/favicon.ico" />
    <link rel="icon" type="image/png" href="./help/assets/images/favicon.png" />
    <!-- The two faces the first screen needs, so they are fetched with the CSS -->
    <link
      rel="preload"
      href="./help/assets/fonts/nunito-sans-variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="./help/assets/fonts/lora-variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="./help/assets/css/fonts.css" />
    <link rel="stylesheet" href="./help/assets/css/base.css" />
    <link rel="stylesheet" href="./help/assets/css/landing.css" />
    <!-- This page only redirects; without JS the script below never runs. -->
    <noscript>
      <meta http-equiv="refresh" content="0; url=./help/" />
    </noscript>
  </head>
  <body>
    <div class="container">
      <div class="logo">
        <img src="./help/assets/images/favicon.png" alt="Oniichan.wtf Logo" draggable="false" />
      </div>
      <h1>Oniichan.wtf</h1>
      <p class="subtitle">SDVX &amp; Yuancon FAQ Guide</p>

      <div class="link-container">
        <a href="./help/" id="mainLink">Enter Site</a>
      </div>

      <p class="note">Redirecting automatically...</p>
    </div>

    <!-- Inline: one request fewer on the path that wants to be fastest. The <noscript>
         refresh above covers no-JS. -->
    <script type="module">
      const redirectTimeout = setTimeout(() => {
        window.location.href = "./help/";
      }, 1500);

      // Pressing the link navigates anyway; stop the timer so the two cannot race.
      document
        .getElementById("mainLink")
        .addEventListener("click", () => clearTimeout(redirectTimeout));
    </script>
  </body>
</html>
